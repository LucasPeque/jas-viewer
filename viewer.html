<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>J.A.S - Historial Veterinario</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      margin: 0;
      padding: 20px;
      color: #e5e7eb;
    }
    .card {
      max-width: 420px;
      margin: 40px auto;
      background: #111827;
      border-radius: 16px;
      border: 2px solid #16a34a;
      padding: 24px;
    }
    .header {
      background: #16a34a;
      color: white;
      padding: 20px;
      border-radius: 12px;
      text-align: center;
      margin-bottom: 20px;
    }
    .field {
      margin-bottom: 12px;
    }
    .label {
      font-weight: bold;
      color: #9ca3af;
    }
    .value {
      margin-top: 4px;
    }
    .history {
      background: #1f2937;
      padding: 12px;
      border-radius: 8px;
      white-space: pre-wrap;
      margin-top: 8px;
    }
    .loading {
      text-align: center;
      padding: 40px;
    }
    .error {
      background: #7f1d1d;
      padding: 16px;
      border-radius: 8px;
      color: #fecaca;
      text-align: center;
    }
  </style>
</head>
<body>

<div class="card">
  <div class="header">
    <h2>J.A.S – Historial Veterinario</h2>
    <p>Vista de solo lectura</p>
  </div>

  <div id="loading" class="loading">
    Cargando historial…
  </div>

  <div id="content" style="display:none;">
    <div class="field"><div class="label">Mascota</div><div class="value" id="petName"></div></div>
    <div class="field"><div class="label">Especie</div><div class="value" id="species"></div></div>
    <div class="field"><div class="label">Clínica</div><div class="value" id="clinic"></div></div>
    <div class="field"><div class="label">Fecha</div><div class="value" id="date"></div></div>
    <div class="field"><div class="label">Historial médico</div><div class="history" id="history"></div></div>
  </div>

  <div id="error" class="error" style="display:none;"></div>
</div>

<script>
async function load() {
  try {
    const params = new URLSearchParams(window.location.search);
    const cid = params.get("cid");
    const key = JSON.parse(atob(params.get("key")));
    const iv = JSON.parse(atob(params.get("iv")));

    if (!cid || !key || !iv) throw "Parámetros inválidos";

    const res = await fetch(`https://ipfs.io/ipfs/${cid}`);
    const buffer = await res.arrayBuffer();

    const cryptoKey = await crypto.subtle.importKey(
      "raw",
      new Uint8Array(key),
      "AES-GCM",
      false,
      ["decrypt"]
    );

    const decrypted = await crypto.subtle.decrypt(
      { name: "AES-GCM", iv: new Uint8Array(iv) },
      cryptoKey,
      buffer
    );

    const data = JSON.parse(new TextDecoder().decode(decrypted));

    document.getElementById("petName").innerText = data.name;
    document.getElementById("species").innerText = data.species;
    document.getElementById("clinic").innerText = data.clinicName;
    document.getElementById("date").innerText = new Date(data.timestamp).toLocaleString();
    document.getElementById("history").innerText = data.medicalNotes;

    document.getElementById("loading").style.display = "none";
    document.getElementById("content").style.display = "block";

  } catch (e) {
    document.getElementById("loading").style.display = "none";
    document.getElementById("error").style.display = "block";
    document.getElementById("error").innerText = "Error al cargar el historial";
    console.error(e);
  }
}

load();
</script>

</body>
</html>
