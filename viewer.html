<script>
async function decryptData(cipherBytes, keyBytes, ivBytes) {
  const key = await crypto.subtle.importKey(
    "raw",
    new Uint8Array(keyBytes),
    { name: "AES-GCM" },
    false,
    ["decrypt"]
  );

  const decrypted = await crypto.subtle.decrypt(
    { name: "AES-GCM", iv: new Uint8Array(ivBytes) },
    key,
    cipherBytes
  );

  return JSON.parse(new TextDecoder().decode(decrypted));
}

function getParam(name) {
  return new URLSearchParams(window.location.search).get(name);
}

async function loadRecord() {
  const cid = getParam("cid");
  const key = JSON.parse(atob(getParam("key")));
  const iv = JSON.parse(atob(getParam("iv")));

  if (!cid || !key || !iv) {
    document.getElementById("output").innerText =
      "â ParÃ¡metros invÃ¡lidos o incompletos.";
    return;
  }

  try {
    const response = await fetch(`https://ipfs.io/ipfs/${cid}`);

    const buffer = await response.arrayBuffer();
    const cipherBytes = new Uint8Array(buffer);

    const record = await decryptData(cipherBytes, key, iv);

    document.getElementById("output").innerHTML =
      "<h2>Historial descifrado</h2><pre>" +
      JSON.stringify(record, null, 2) +
      "</pre>";
  } catch (err) {
    console.error(err);
    document.getElementById("output").innerText =
      "â Error al cargar o descifrar el historial.";
  }
}

loadRecord();

<script>
async function loadFromIPFS() {
  const params = new URLSearchParams(window.location.search);
  const cid = params.get("cid");
  const key = params.get("key");
  const iv = params.get("iv");

  if (!cid || !key || !iv) {
    document.getElementById("content").innerText =
      "â No se han proporcionado datos vÃ¡lidos.";
    return;
  }

  // Descargar archivo cifrado desde IPFS
  const response = await fetch(`https://gateway.pinata.cloud/ipfs/${cid}`);
  const encryptedBuffer = await response.arrayBuffer();

  // Preparar claves
  const rawKey = new Uint8Array(JSON.parse(atob(key)));
  const ivBytes = new Uint8Array(JSON.parse(atob(iv)));

  const cryptoKey = await crypto.subtle.importKey(
    "raw",
    rawKey,
    "AES-GCM",
    true,
    ["decrypt"]
  );

  // Descifrar
  const decrypted = await crypto.subtle.decrypt(
    { name: "AES-GCM", iv: ivBytes },
    cryptoKey,
    encryptedBuffer
  );

  const text = new TextDecoder().decode(decrypted);
  const data = JSON.parse(text);

  renderRealData(data);
}

function renderRealData(data) {
  document.getElementById("petName").innerText = data.name || "";
  document.getElementById("species").innerText = data.species || "";
  document.getElementById("clinic").innerText = data.clinicName || "";
  document.getElementById("date").innerText = new Date(data.timestamp).toLocaleString();
  document.getElementById("history").innerText = data.medicalNotes || "";
}

window.onload = loadFromIPFS;
</script>
